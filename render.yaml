# Render blueprint: the public demo, both halves of it.
#
# The API runs in demo mode and nothing else. DATABASE_URL and the Meta
# credentials are deliberately absent from this file and must stay absent from
# the service's environment: in demo mode app/main.py builds an in-memory
# database instead of opening the real store, so a deployed instance cannot
# reach a real client's figures even if it wanted to. The nightly ingest is not
# deployed here at all — it runs from GitHub Actions against the real store.
#
# Each service is told the other's address by Render rather than by hand, which
# is what makes the pair deployable in one click: the dashboard needs the API's
# URL to call it, and the API needs the dashboard's origin to allow it through
# CORS. Both arrive as bare hostnames; both sides prepend the scheme.
services:
  - type: web
    name: meta-agency-dashboard-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      # Render's default Python drifts; the code targets 3.11+.
      - key: PYTHON_VERSION
        value: 3.11.9
      # The only reason this instance is safe to make public.
      - key: DEMO_MODE
        value: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: meta-agency-dashboard-web
          property: host

  - type: web
    name: meta-agency-dashboard-web
    runtime: static
    # No region: a static site is served from Render's CDN everywhere, and
    # naming one is rejected.
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      # Read at build time by Vite and baked into the bundle.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: meta-agency-dashboard-api
          property: host
    routes:
      # React Router uses real paths, so a direct link to /analytics must be
      # served the app rather than a 404.
      - type: rewrite
        source: /*
        destination: /index.html
