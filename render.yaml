# Render blueprint: the public demo, both halves of it.
#
# The API runs in demo mode and nothing else. DATABASE_URL and the Meta
# credentials are deliberately absent from this file and must stay absent from
# the service's environment: in demo mode app/main.py builds an in-memory
# database instead of opening the real store, so a deployed instance cannot
# reach a real client's figures even if it wanted to. The nightly ingest is not
# deployed here at all — it runs from GitHub Actions against the real store.
#
# Each service needs the other's address: the dashboard calls the API, and the
# API must allow the dashboard's origin through CORS. Both are written out in
# full below. `fromService` with `property: host` looks like the tidier way to
# do it and is not: it yields the internal service name — "meta-agency-
# dashboard-api", with no domain — which does not resolve from a browser and
# never matches an Origin header. Both env vars silently took that value on the
# first deploy, which cost a round of debugging. Public URLs, spelled out.
#
# The consequence of spelling them out: renaming a service, or serving this
# from a custom domain, means editing the two URLs here. The frontend must then
# be rebuilt rather than restarted, because Vite bakes its value in at build
# time.
services:
  - type: web
    name: meta-agency-dashboard-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      # Render's default Python drifts; the code targets 3.11+.
      - key: PYTHON_VERSION
        value: 3.11.9
      # The only reason this instance is safe to make public.
      - key: DEMO_MODE
        value: true
      # The origin CORS allows: the dashboard, and nothing else.
      - key: FRONTEND_ORIGIN
        value: https://meta-agency-dashboard-web.onrender.com

  - type: web
    name: meta-agency-dashboard-web
    runtime: static
    # No region: a static site is served from Render's CDN everywhere, and
    # naming one is rejected.
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      # Read at build time by Vite and baked into the bundle.
      - key: VITE_API_BASE_URL
        value: https://meta-agency-dashboard-api.onrender.com
    routes:
      # React Router uses real paths, so a direct link to /analytics must be
      # served the app rather than a 404.
      - type: rewrite
        source: /*
        destination: /index.html
